spring.application.name=insurance-policy-management
server.port=8090

spring.devtools.restart.enabled=false

# ---------------------------------------------------------------
# Database: in-memory H2 by default, so the app runs with no setup.
# Run with --spring.profiles.active=postgres to use PostgreSQL instead.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ipmdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# JWT: set JWT_SECRET (at least 32 characters) in any real deployment.
# ---------------------------------------------------------------
jwt.secret=${JWT_SECRET:QrSckOlEtsT3CfCfzrMJfJ3ndakIxFQYy7z+JfpNcNc=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------
# Initial admin account, created on startup if missing.
# Change these via environment variables in any real deployment.
# ---------------------------------------------------------------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
